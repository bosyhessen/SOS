<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOS – Interactive Body Map</title>
<style>
:root{--bg:#F2F5F3;--card:#FFFFFF;--line:#D5E0DA;--ink:#101513;--mute:#4F6058;--dark:#0D1110;--green:#1E7F6D;--accent:#4DB6A0;--body:#CFE8C8;--panel:#0D1110;--panelink:#EAF2EE;--onacc:#0D1110;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1110;--card:#1B2622;--line:#2A3A34;--ink:#EAF2EE;--mute:#A9BDB4;--green:#4DB6A0;--panel:#070A09}}
:root[data-theme="dark"]{--bg:#0D1110;--card:#1B2622;--line:#2A3A34;--ink:#EAF2EE;--mute:#A9BDB4;--green:#4DB6A0;--panel:#070A09}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px clamp(16px,4vw,48px);background:var(--dark);color:#EAF2EE}
.logo b{font-size:28px;letter-spacing:1px;color:var(--accent)}
.logo span{display:block;font-size:14px;opacity:.85}
.sos{background:var(--accent);color:var(--onacc);font-weight:800;text-decoration:none;padding:12px 22px;border-radius:999px;font-size:16px}
main{display:grid;grid-template-columns:minmax(280px,480px) 1fr;gap:clamp(16px,3vw,40px);max-width:1200px;margin:0 auto;padding:clamp(16px,3vw,40px)}
.map{background:#FFFFFF;border-radius:24px;padding:16px;text-align:center}
.map p{color:#0D1110;font-weight:600;margin:0 0 8px;font-size:15px}
svg{width:100%;max-width:520px;height:auto}
.r *{fill:rgba(77,182,160,0);stroke:rgba(13,17,16,.5);stroke-width:2.5;stroke-dasharray:7 6;stroke-linejoin:round;transition:fill .15s}
.r{cursor:pointer;outline:none}
.r:hover *,.r:focus *,.r.on *{fill:rgba(77,182,160,.6);stroke:#0D1110;stroke-width:3.5;stroke-dasharray:none}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,32px);min-height:420px}
.panel h1{margin:0 0 4px;font-size:clamp(24px,4vw,34px);color:var(--green)}
.hint{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.tab{border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
ol{padding-left:22px;margin:0 0 20px}
li{margin-bottom:8px;font-size:17px}
.video{display:flex;align-items:center;gap:14px;background:var(--panel);color:var(--panelink);border-radius:16px;padding:16px 20px}
.play{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-size:20px;flex:none}
.video small{display:block;opacity:.8}
.badge{margin-left:auto;font-size:13px;font-weight:700;border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.note{color:var(--mute);font-size:14px;margin:16px 0 0}
@media (max-width:760px){main{grid-template-columns:1fr}.map{order:1}}
</style>
</head>

  <section class="panel" id="panel" aria-live="polite">
    <h1>Choose a body area</h1>
    <p class="hint">Tap a part of the body to see the first aid situations related to it, with step-by-step guidance and a video.</p>

</main>
<script>
var D={
head:{n:"Head",i:[
{t:"Head injury",v:"Online",s:["Keep the person still and calm.","Apply gentle pressure with a clean cloth to any bleeding.","Do not give food or drink.","Call the ambulance if there is confusion, vomiting or loss of consciousness."]},
{t:"Nosebleed",v:"Offline",s:["Sit upright and lean slightly forward.","Pinch the soft part of the nose for 10 minutes.","Breathe through the mouth.","Seek help if bleeding continues after 20 minutes."]},
{t:"Fainting",v:"Offline",s:["Lay the person down and raise the legs.","Loosen tight clothing.","Check breathing.","Call the ambulance if they do not wake up quickly."]}]},
chest:{n:"Chest",i:[
{t:"Cardiac arrest (CPR)",v:"Online",s:["Check response and breathing, then call the ambulance.","Place the heel of your hand on the centre of the chest.","Push hard and fast, about 5–6 cm deep, 100–120 per minute.","Continue until help arrives or the person recovers."]},
{t:"Chest pain",v:"Online",s:["Call the ambulance immediately.","Help the person sit and rest in a comfortable position.","Loosen tight clothing.","Stay with them and monitor breathing."]},
{t:"Choking (adult)",v:"Offline",s:["Ask: Are you choking? Encourage coughing.","Give up to 5 firm back blows between the shoulder blades.","Give up to 5 abdominal thrusts.","Alternate until the object clears; call the ambulance if not."]}]},
abdomen:{n:"Abdomen",i:[
{t:"Abdominal injury",v:"Online",s:["Lay the person down with knees bent.","Do not press on the area or give food or drink.","Cover with a clean cloth if there is a wound.","Call the ambulance."]},
{t:"Choking (abdominal thrusts)",v:"Offline",s:["Stand behind the person and wrap your arms around the waist.","Make a fist above the navel.","Pull sharply inwards and upwards.","Repeat until the object is expelled."]}]},
arm:{n:"Arm",i:[
{t:"Fracture",v:"Online",s:["Keep the arm still; do not straighten it.","Support it with a splint or folded cloth.","Apply a cold pack wrapped in cloth.","Take the person to hospital."]},
{t:"Burn",v:"Offline",s:["Cool under running water for 20 minutes.","Remove rings or tight items before swelling.","Cover loosely with a clean non-stick dressing.","Never use ice, butter or toothpaste."]},
{t:"Severe bleeding",v:"Offline",s:["Press firmly on the wound with a clean cloth.","Do not remove the cloth; add more on top.","Raise the arm if possible.","Call the ambulance."]}]},
leg:{n:"Leg",i:[
{t:"Fracture",v:"Online",s:["Keep the leg still; do not move the person unless in danger.","Support the leg on both sides.","Apply a cold pack wrapped in cloth.","Call the ambulance."]},
{t:"Sprain",v:"Offline",s:["Rest the joint.","Apply a cold pack for 15–20 minutes.","Wrap with a firm bandage.","Raise the leg above heart level."]},
{t:"Severe bleeding",v:"Offline",s:["Press firmly on the wound with a clean cloth.","Keep the person lying down.","Do not remove soaked cloths; add more.","Call the ambulance."]}]}
};
var panel=document.getElementById("panel"),cur=null,idx=0;
function show(){
  var a=D[cur],it=a.i[idx],h='<h1>'+a.n+'</h1><p class="hint">Select a situation:</p><div class="tabs">';
  a.i.forEach(function(x,k){h+='<button class="tab'+(k===idx?' on':'')+'" data-k="'+k+'">'+x.t+'</button>';});
  h+='</div><ol>'+it.s.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>';
  h+='<div class="video"><div class="play">▶</div><div><b>Video: '+it.t+'</b><small>Demonstration of the correct technique</small></div><span class="badge">'+it.v+'</span></div>';
  h+='<p class="note">Educational guidance only. In any serious emergency, call the ambulance (123) first.</p>';
  panel.innerHTML=h;
}
function pick(r){
  cur=r;idx=0;
  document.querySelectorAll(".r").forEach(function(e){e.classList.toggle("on",e.dataset.r===r);});
  show();
}
document.querySelectorAll(".r").forEach(function(e){
  e.addEventListener("click",function(){pick(e.dataset.r);});
  e.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(e.dataset.r);}});
});
panel.addEventListener("click",function(ev){
  var b=ev.target.closest(".tab");
  if(b){idx=+b.dataset.k;show();}
});
</script>
